<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 100" width="60" height="100">
  <!-- Sombra base -->
  <ellipse cx="30" cy="97" rx="16" ry="4" fill="rgba(0,0,0,0.25)"/>
  <!-- Base/pie del cilindro -->
  <rect x="12" y="84" width="36" height="10" rx="5" fill="#7f8c8d"/>
  <!-- Cuerpo principal -->
  <rect x="10" y="22" width="40" height="64" rx="6" fill="#e74c3c"/>
  <!-- Domo superior -->
  <ellipse cx="30" cy="22" rx="20" ry="8" fill="#c0392b"/>
  <!-- Collar / hombro -->
  <rect x="14" y="11" width="32" height="13" rx="5" fill="#bdc3c7"/>
  <!-- Cuello -->
  <rect x="22" y="5" width="16" height="8" rx="3" fill="#95a5a6"/>
  <!-- Válvula (rueda) -->
  <circle cx="30" cy="4" r="6" fill="none" stroke="#2c3e50" stroke-width="2.5"/>
  <line x1="30" y1="0" x2="30" y2="8" stroke="#2c3e50" stroke-width="2"/>
  <line x1="24" y1="4" x2="36" y2="4" stroke="#2c3e50" stroke-width="2"/>
  <!-- Reflejo / brillo -->
  <rect x="14" y="25" width="9" height="56" rx="4" fill="rgba(255,255,255,0.28)"/>
  <!-- Área de etiqueta -->
  <rect x="13" y="38" width="34" height="30" rx="4" fill="rgba(255,255,255,0.2)"/>
  <!-- Texto GAS -->
  <text x="30" y="57" font-size="10" font-family="Arial, sans-serif" text-anchor="middle" fill="white" font-weight="bold" letter-spacing="1">GAS</text>
  <!-- Línea decorativa inferior etiqueta -->
  <rect x="13" y="68" width="34" height="3" rx="1" fill="rgba(0,0,0,0.15)"/>
</svg>
